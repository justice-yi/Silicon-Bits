services:
  app:
    build: .
    ports:
      - "9090:8080"
    volumes:
      - ./data:/data
    environment:
      - PORT=8080
      - DATA_DIR=/data
      - AUTH_USERNAME=admin
      - AUTH_PASSWORD=silicon
      - DRAWIO_URL=http://drawio:8080
    restart: unless-stopped

  drawio:
    image: jgraph/drawio
    ports:
      - "9091:8080"
    restart: unless-stopped

