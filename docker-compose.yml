services:
  app:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data
    environment:
      - PORT=8080
      - DATA_DIR=/data
      - AUTH_USERNAME=admin
      - AUTH_PASSWORD=silicon
    restart: unless-stopped

